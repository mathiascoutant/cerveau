# /etc/nginx/sites-available/cerveau.neurorun.fr
#
# Reverse proxy devant le conteneur Cerveau, publié sur 127.0.0.1:9087.
# Le bloc TLS est ajouté automatiquement par :
#   sudo certbot --nginx -d cerveau.neurorun.fr

server {
    listen 80;
    listen [::]:80;
    server_name cerveau.neurorun.fr;

    # L'app mobile envoie l'audio en secours sur /assistant/voice : la limite
    # nginx par défaut (1 Mo) tronquerait l'envoi.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:9087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Raoul enchaîne jusqu'à 5 appels d'outils (IMAP, Slack, modèle) : une
        # réponse prend 5 à 15 s selon les sources connectées, le défaut nginx
        # de 60 s finirait par couper.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
